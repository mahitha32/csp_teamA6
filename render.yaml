services:
  - type: web
    name: vemavaram-backend-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT run:app
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: vemavaram_csp
      - key: DB_USER
        value: 2gTwxEHDidZGkwa.root
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: CLOUDINARY_CLOUD_NAME
        value: vslqythf
      - key: CLOUDINARY_API_KEY
        value: "114721286415457"
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://complaintredressalsystem.vercel.app,http://localhost:3000,http://localhost:5173
